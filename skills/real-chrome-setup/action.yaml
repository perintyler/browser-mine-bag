version: 1
name: real-chrome-setup
description: Setup and troubleshooting for driving the user's real Chrome with their existing logins. Use when browser-mine tool calls error or hang, when pages render logged-out, or when the user wants Barry to browse as themselves for the first time. Read the troubleshooting section before concluding this mode is blocked — port 9222 is NOT the health check.
prompt: |-
  # Driving the real Chrome

  The `browser-mine` mode attaches to the user's already-running Chrome, so pages
  load with their real cookies and sessions.

  **Check whether it already works before setting anything up.** Call
  `list_pages`: if it returns the user's tabs, this mode is working and there is
  nothing to do here. Observed working with no opt-in visible on the DevTools
  port at all, so do not infer a broken state from port checks — see the
  troubleshooting section, which exists mostly to stop that inference.

  ## Why there is no way around this

  Chrome refuses `--remote-debugging-port` on the default user-data-dir — Google's
  docs state the regular browsing profile cannot be used that way, and it was
  verified on this machine. Launching Chrome with a debugging flag therefore gets
  you a *fresh* profile, which is exactly the logged-out browser the clean modes
  already provide.

  So the routes to the real profile are `chrome-devtools-mcp --autoConnect`
  (Chrome 144+, what this bag uses) or the `@playwright/mcp --extension` bridge.
  `--autoConnect` attaches over its own channel rather than the 9222 DevTools
  HTTP endpoint, which is why its health is invisible to `curl` on that port.

  ## The opt-in (only if `list_pages` does not already work)

  1. In Chrome, open `chrome://inspect/#remote-debugging`.
  2. Enable remote debugging.
  3. Accept the confirmation dialog.

  It persists, so this is genuinely once per machine. Ask the user to do it — you
  cannot click through a Chrome settings page on their behalf, and shouldn't try.

  ## What the user is agreeing to

  Say this plainly before asking, rather than after:

  - It exposes browser content to the MCP client. Google's own warning on that
    page is explicit, and it is a real security tradeoff, not a formality.
  - `--autoConnect` attaches to the running browser and **can see every open tab**,
    including ones unrelated to the task — email, banking, work systems.
  - Anything reachable while logged in is reachable by the agent, including
    actions that change state.

  Treat it as borrowing someone's unlocked laptop: navigate deliberately, stay on
  the task you were asked to do, don't rummage through other tabs, and don't
  close or disturb the user's windows.

  ## When it isn't working

  - **Do NOT diagnose this mode with `curl 127.0.0.1:9222`.** That check is
    worse than useless here: it reports a problem when there is none, and it
    has twice sent sessions into a dead end that ended in "stop retrying" while
    this mode was working the whole time.

    Verified 2026-08-25 on Chrome 151.0.7922.174: `9222/json` returned **404**
    while `list_pages` returned the real tab list in 3s, and
    `github.com/settings/profile` loaded as **"Your profile"** — i.e. the real
    logged-in profile, attached, over a 404 port.

    `chrome-devtools-mcp --autoConnect` does not use the 9222 DevTools HTTP
    endpoint. It attaches over its own channel, so that port's status says
    nothing about whether this mode works. A 404 there is the normal resting
    state, not a fault.

    The only check that can actually fail correctly is calling a tool:

        list_pages

    If that returns pages, this mode is working — whatever port 9222 says. If
    it errors or hangs, then start diagnosing.

  - **Pages render logged-out** — `--autoConnect` fell back to a fresh context
    instead of the real profile. This is the one symptom that genuinely means
    the attach is wrong; `list_pages` returning the user's real tabs rules it
    out. Confirm against a page that requires login rather than by eye.
  - **Connection refused** — Chrome isn't running. It must already be open;
    this mode attaches, it does not launch.
  - **Tool calls hang with no error** — rare, and *not* diagnosable via 9222
    (see above). `initialize` succeeding tells you nothing either: the server
    registers all 29 tools without touching Chrome, so a healthy tool list is
    not evidence of an attach. Confirm with `list_pages`; if it hangs, restart
    the session so the pack reconnects.

    Historical note, kept so it is not re-investigated: a long run of 404s on
    this port was once read as "target discovery is gated on Chrome 151" and
    marked unresolved. That conclusion was wrong — the port was never the
    mechanism. Ruled out along the way, all still true and all irrelevant to
    whether this mode works: no MDM policy, the `Local State` toggle really is
    set (`devtools.remote_debugging.user-enabled = true`), the DevTools server
    really is up and serving 404s, and a genuinely cold Chrome (verified fresh
    pid, updated build) still 404s.

    Nothing on the Barry side affects any of this — the `browser` (headless) bag
    keeps working throughout.
  - **Tools not found** — the session lacks the `browser-mine` trait, or is using
    Playwright's `browser_*` names. This mode's tools are `navigate_page`,
    `take_snapshot`, `click`, and friends. See the `web-browsing` skill.

  If the real profile isn't required, prefer `browser-headless` — it has none of
  this setup or exposure.
